# Matrix Client-Server API bot with a persistent Olm/Megolm device.
enabled: false
homeserver-url: "https://matrix-client.matrix.org"
access-token: ""
default-language: "zh_cn"

encryption:
  # Optional account recovery key: restores cross-signing secrets and room-key backup.
  # Use a dedicated device token; keep social/matrix-crypto together with its database.key files.
  recovery-key: ""

sync:
  timeout-millis: 30000
  max-response-bytes: 2097152
  reconnect-base-delay-millis: 1000
  reconnect-max-delay-millis: 30000
  max-reconnect-attempts: 10

worker:
  max-concurrent-tasks: 64

# Required when enabled: rooms or Spaces granting server admission.
# Use the !room ID, not its #alias. The bot must join each source.
# Joining a child chat room does not grant membership in its parent Space.
membership:
  room-ids: []
  # - "!communitySpace:example.org"

# Required when enabled: chat rooms accepting bot commands, encrypted or unencrypted.
# This list does not grant server admission or enable chat interoperability.
commands:
  room-ids: []
  # - "!botChat:example.org"

# Empty disables chat interoperability. inbound = Matrix to Minecraft;
# outbound = Minecraft to Matrix. Each omitted direction defaults to always.
# Routes are independent of membership and command rooms; the bot must join each room.
chat-bridge:
  routes: []
  # Full interoperability example:
  # - room-id: "!public:example.org"
  #   inbound:
  #     mode: "always"
  #   outbound:
  #     mode: "always"
  # Prefix-triggered example in both directions: "#hello" becomes "hello".
  # - room-id: "!relay:example.org"
  #   inbound:
  #     mode: "prefix"
  #     prefix: "#"
  #     strip-prefix: true
  #   outbound:
  #     mode: "prefix"
  #     prefix: "#"
  #     strip-prefix: true

# Uses Qwen3Guard and the shared credentials in social/content-safety.yml.
content-safety:
  enabled: false

reply:
  max-message-length: 4000
