# Matrix Client-Server API bot adapter. Encrypted rooms are not supported.
enabled: false
homeserver-url: "https://matrix-client.matrix.org"
access-token: ""
default-language: "zh_cn"

sync:
  timeout-millis: 30000
  max-response-bytes: 2097152
  reconnect-base-delay-millis: 1000
  reconnect-max-delay-millis: 30000
  max-reconnect-attempts: 10

worker:
  max-concurrent-tasks: 64

# Empty accepts every unencrypted room joined by the bot.
allowed-room-ids: []

# Empty disables chat interoperability. inbound = Matrix to Minecraft;
# outbound = Minecraft to Matrix. Each omitted direction defaults to always.
chat-bridge:
  routes: []
  # Full interoperability example:
  # - room-id: "!public:example.org"
  #   inbound:
  #     mode: "always"
  #   outbound:
  #     mode: "always"
  # Prefix-triggered example in both directions: "#hello" becomes "hello".
  # - room-id: "!relay:example.org"
  #   inbound:
  #     mode: "prefix"
  #     prefix: "#"
  #     strip-prefix: true
  #   outbound:
  #     mode: "prefix"
  #     prefix: "#"
  #     strip-prefix: true

# Uses Qwen3Guard and the shared credentials in social/content-safety.yml.
content-safety:
  enabled: false

reply:
  max-message-length: 4000
