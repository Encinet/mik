# QQ platform adapter using Gateway events and OpenAPI messages.
enabled: false
app-id: ""
app-secret: ""
default-language: "zh_cn"

api-base-url: "https://api.sgroup.qq.com"
access-token-url: "https://bots.qq.com/app/getAppAccessToken"

gateway:
  debug: false
  reconnect-base-delay-millis: 1000
  reconnect-max-delay-millis: 30000
  max-reconnect-attempts: 10
  max-frame-bytes: 1048576
  handshake-timeout-millis: 30000

worker:
  max-concurrent-tasks: 64

allowed-group-openids: []

# Empty disables chat interoperability. Each group chooses its own Minecraft
# outbound policy; QQ-to-Minecraft text is enabled for every listed group.
chat-bridge:
  routes: []
  # Full interoperability example:
  # - group-openid: "your-group-openid"
  #   outbound:
  #     mode: "always"
  # Prefix-triggered example: "#hello" is sent as "hello".
  # - group-openid: "another-group-openid"
  #   outbound:
  #     mode: "prefix"
  #     prefix: "#"
  #     strip-prefix: true

content-safety:
  enabled: true

reply:
  max-message-length: 1500
