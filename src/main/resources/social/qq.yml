# QQ platform adapter using Gateway events and OpenAPI messages.
enabled: false
app-id: ""
app-secret: ""
default-language: "zh_cn"

gateway:
  debug: false
  reconnect-base-delay-millis: 1000
  reconnect-max-delay-millis: 30000
  max-reconnect-attempts: 10
  max-frame-bytes: 1048576
  handshake-timeout-millis: 30000

worker:
  max-concurrent-tasks: 64

# Required when enabled: communities granting identity binding and server admission.
# Membership is observed from group messages and member join/leave events.
allowed-group-openids: []

# Empty disables automatic join approval. Each group must use its own Base32
# secret, shared with the external verifier (SHA-1, 6 digits, 30 seconds).
# Only the current and previous 30-second steps at QQ's apply_at time pass.
group-join:
  # Scan pending applications at startup, after reconnect, and every 30 seconds.
  # Range: 10-3600. Paginated API calls are paced across both groups.
  reconcile-interval-seconds: 30
  groups: []
  # - group-openid: "first-group-openid"
  #   totp-secret: "YOUR_FIRST_BASE32_SECRET"
  # - group-openid: "second-group-openid"
  #   totp-secret: "YOUR_SECOND_BASE32_SECRET"

# Empty disables chat interoperability. inbound = QQ to Minecraft;
# outbound = Minecraft to QQ. Each omitted direction defaults to always.
chat-bridge:
  routes: []
  # Full interoperability example:
  # - group-openid: "your-group-openid"
  #   inbound:
  #     mode: "always"
  #   outbound:
  #     mode: "always"
  # Prefix-triggered example in both directions: "#hello" becomes "hello".
  # - group-openid: "another-group-openid"
  #   inbound:
  #     mode: "prefix"
  #     prefix: "#"
  #     strip-prefix: true
  #   outbound:
  #     mode: "prefix"
  #     prefix: "#"
  #     strip-prefix: true

# Uses Qwen3Guard and the shared credentials in social/content-safety.yml.
content-safety:
  enabled: true

reply:
  max-message-length: 1500
