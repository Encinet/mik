syntax = "proto3";
package mik.v1;
option java_package = "org.encinet.mik.protocol";
option java_multiple_files = true;
import "mik/chat_message.proto";
import "mik/identity.proto";

// This ingress is authenticated as Paper. The daemon assigns the event origin.
message ChatPublication {
  message Direct {
    ChatPlayer recipient = 1;
    // Local delivery did not take responsibility for this recipient.
    bool require_remote_recipient = 2;
  }

  message Post {
    message Part {
      message PlayerMention {
        // Minecraft account name, without the @ prefix.
        string player_name = 1;
        // The exact visible label, split into styled runs.
        repeated ChatTextRun runs = 2;
      }
      reserved 2;
      oneof input {
        ChatPart resolved = 1;
        // A candidate recognized by Paper, resolved only for unrestricted public posts.
        // If not resolved, the label stays ordinary text.
        PlayerMention player_mention = 3;
      }
    }

    ChatPlayer author = 1;
    oneof destination {
      ChatDestination.Room room = 2;
      Direct direct = 3;
    }
    repeated Part parts = 4;
  }

  string message_id = 1;
  int64 created_at_ms = 2;
  ChatVisibility visibility_limit = 3;
  oneof subject {
    Post post = 4;
    ChatPresenceNotice presence = 5;
  }
}

message ChatCommand {
  oneof operation {
    ChatPublication publish = 1;
    ChatPoll poll = 2;
  }
}

message ChatResult {
  oneof value {
    string published_id = 1;
    ChatDeliveries deliveries = 2;
  }
}

message ChatPoll {}
message ChatDeliveries { repeated PaperChatDelivery entries = 1; }

message PaperChatDelivery {
  ChatEvent event = 1;
  // Current single-person mention targets. Paper checks the actual recipients
  // and their notification preferences before playing an alert.
  repeated string mention_player_ids = 2;
}
