syntax = "proto3";
package mik.v1;
option java_package = "org.encinet.mik.protocol";
option java_multiple_files = true;
import "mik/identity.proto";

message ChatEvent {
  string message_id = 1;
  ChatRecord record = 2;
  // Absent means no additional restriction. Present but empty means nobody.
  ChatVisibility visibility = 3;
}

message ChatVisibility { repeated string player_ids = 1; }

// Canonical record shared by history and every delivery target.
message ChatRecord {
  int64 created_at_ms = 1;
  // Registered ingress platform (game, web or an external platform ID).
  string platform = 2;
  oneof kind {
    ChatUserRecord user = 3;
    ChatPresenceNotice presence = 4;
  }
}

message ChatDestination {
  enum Room {
    ROOM_UNSPECIFIED = 0;
    PUBLIC = 1;
    STAFF = 2;
  }
  oneof target {
    Room room = 1;
    // The other participant is always the author of the user message.
    ChatPlayer recipient = 2;
  }
}

message ChatUserRecord {
  ChatDestination destination = 1;
  ChatIdentity author = 2;
  ChatBody body = 3;
}

message ChatIdentity {
  oneof principal {
    ChatPlayer player = 1;
    ChatExternalActor external = 2;
  }
}

message ChatExternalActor {
  ChatExternalIdentity account = 1;
  // Verified at admission. Not a grant of current permissions.
  ChatPlayer bound_player = 2;
}

message ChatPresenceNotice {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    JOINED = 1;
    LEFT = 2;
  }
  Kind kind = 1;
  ChatPlayer player = 2;
}

message ChatBody { repeated ChatPart parts = 1; }

message ChatPart {
  reserved 3, 4;
  oneof content {
    ChatTextRun text = 2;
    ChatDescription description = 5;
    ChatReference reference = 6;
  }
}

message ChatTextStyle {
  optional uint32 color = 1;
  optional uint32 gradient_end_color = 2;
  bool bold = 3;
  bool italic = 4;
  bool underlined = 5;
  bool strikethrough = 6;
}

message ChatTextRun {
  string text = 1;
  ChatTextStyle style = 2;
}

message ChatReference {
  message Link {
    string uri = 1;
    bool automatic = 2;
  }
  message Audience {} // Mention all eligible readers of this conversation.
  // A single reference owns the entire label, even when it has mixed styles.
  repeated ChatTextRun runs = 1;
  oneof target {
    Link link = 2;
    ChatIdentity person = 3; // Mention this identity, not a lookup by label.
    Audience audience = 4;
  }
}

message ChatDescription {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    AUDIO = 1;
    CARD = 2;
    CONTACT = 3;
    EMOTE = 4;
    FACE = 5;
    FILE = 6;
    HISTORY = 7;
    IMAGE = 8;
    LOCATION = 9;
    reserved 10;
    MULTIPLE = 11;
    MUSIC = 12;
    NOTICE = 13;
    REPLY = 14;
    STICKER = 15;
    VIDEO = 16;
  }
  oneof label {
    Kind kind = 1;  // A display category that targets can localize.
    string name = 2; // A literal fallback supplied by the source, e.g. an item name.
  }
  ChatTextStyle style = 3;
}
