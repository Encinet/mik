[workspace]
members = ["crates/mik-protocol", "services/mikd"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "1.0.0"
license = "GPL-3.0-only"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false }
prost = { version = "=0.14.6", default-features = false, features = ["derive"] }
prost-build = { version = "=0.14.6", default-features = false }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "sync", "macros"] }
uuid = "=1.29.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
significant_drop_in_scrutinee = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
