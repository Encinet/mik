name: mikd contract and transport
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - uses: arduino/setup-protoc@v3
        with:
          version: '36.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: rustup show
      - run: python3 -m pip install -r tools/mikd/requirements.txt
      - run: python3 -m unittest discover -s tools/mikd -p 'test_*.py'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: ./gradlew build mikdInterop
