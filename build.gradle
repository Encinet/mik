plugins {
    id 'java'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.24"
    id("xyz.jpenilla.run-paper") version "3.1.0"
}

group = 'org.encinet'
version = '1.0'

configurations {
    mockitoAgent {
        canBeConsumed = false
        transitive = false
    }
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "viaversion-repo"
        url = "https://repo.viaversion.com/"
    }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://repo.codemc.io/repository/maven-snapshots/") }
    maven { url = uri("https://dl.cloudsmith.io/public/quickwrite-net/fluent4j/maven/") }
    maven { url = uri("https://repo.plasmoverse.com/releases") }
    maven { url = uri("https://repo.skriptlang.org/releases") }
    maven { url = uri("https://maven.enginehub.org/repo/") }
    maven { url = uri("https://repo.opencollab.dev/main/") }
    maven {
        url = uri("https://nexus.prism-mc.org/repository/maven-releases/")
        content { includeGroup("org.prism_mc.prism") }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = uri("https://api.modrinth.com/maven")
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    compileOnly("com.google.protobuf:protobuf-javalite:4.36.1")
    testImplementation("com.google.protobuf:protobuf-javalite:4.36.1")
    compileOnly("org.bouncycastle:bcprov-jdk18on:1.86")
    testImplementation("org.bouncycastle:bcprov-jdk18on:1.86")
    paperweight.paperDevBundle("26.3.build.206-stable")
    compileOnly("com.github.retrooper:packetevents-spigot:2.14.0")
    compileOnly("com.viaversion:viaversion-api:5.11.0")
    compileOnly("com.google.code.gson:gson:2.14.0")
    compileOnly("com.github.luben:zstd-jni:1.5.7-10")
    compileOnly("maven.modrinth:34T8oVNY:26.3-557")
    testImplementation("maven.modrinth:34T8oVNY:26.3-557")
    compileOnly('net.luckperms:api:5.5')
    compileOnly("net.quickwrite:fluent-builder:1.0.0")
    compileOnly("su.plo.voice.server:paper:2.1.13")
    ['server', 'server-proxy-common', 'common'].each { module ->
        testRuntimeOnly("su.plo.voice.api:${module}:2.1.13") { transitive = false }
    }
    compileOnly("dev.arbjerg:lavaplayer:2.2.7")
    compileOnly("com.github.SkriptLang:Skript:2.16.1")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.16.1")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.16.1") { transitive = false }
    compileOnly("org.prism_mc.prism:prism-paper-api:4.4")
    compileOnly("maven.modrinth:evkiwA7V:Ow8CJ6pP")
    compileOnly("org.geysermc.geyser:api:2.11.1-SNAPSHOT")
    // DreamDisplays 1.10.2 Paper release (includes its public API); the standalone API
    // coordinate is not available in the configured public Maven repositories.
    compileOnly("maven.modrinth:4IIKQyBu:od9F3U52")
    testImplementation("maven.modrinth:4IIKQyBu:od9F3U52")
    testRuntimeOnly("org.xerial:sqlite-jdbc:3.53.2.1")
    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.mockito:mockito-core:5.20.0")
    mockitoAgent("org.mockito:mockito-core:5.20.0")
    testImplementation("dev.arbjerg:lavaplayer:2.2.7")
    testImplementation("io.papermc.paper:paper-api:26.3.build.206-stable")
    testImplementation("com.github.retrooper:packetevents-spigot:2.14.0")
    testImplementation("com.viaversion:viaversion-api:5.11.0")
    testImplementation("net.quickwrite:fluent-builder:1.0.0")
    testImplementation("com.google.code.gson:gson:2.14.0")
    testImplementation("com.github.luben:zstd-jni:1.5.7-10")
    testImplementation("org.jsoup:jsoup:1.22.2")
    testImplementation("net.kyori:adventure-text-minimessage:5.2.0")
    testImplementation("com.github.SkriptLang:Skript:2.17.0")
    testImplementation("com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.16.1")
    testImplementation("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.16.1")
    testImplementation("org.prism_mc.prism:prism-paper-api:4.4")
    testImplementation("net.luckperms:api:5.5")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

def testTempDir = layout.buildDirectory.dir("test-tmp").get().asFile

abstract class MockitoAgentArguments implements CommandLineArgumentProvider {
    @Classpath abstract ConfigurableFileCollection getAgent()
    @Override Iterable<String> asArguments() { return ["-javaagent:${agent.singleFile.absolutePath}"] }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty("java.io.tmpdir", testTempDir.absolutePath)
    doFirst {
        testTempDir.mkdirs()
    }
    jvmArgs(
            "--enable-native-access=ALL-UNNAMED",
            "--sun-misc-unsafe-memory-access=allow"
    )
}

test {
    def agentArguments = objects.newInstance(MockitoAgentArguments)
    agentArguments.agent.from(configurations.mockitoAgent)
    jvmArgumentProviders.add(agentArguments)
    jvmArgs("-Xshare:off") // Static test instrumentation cannot use the shared class archive.
    useJUnitPlatform {
        excludeTags 'benchmark', 'mikd-interop'
    }
}

tasks.register('benchmark', Test) {
    group = 'verification'
    description = 'Reports local performance measurements without running the regression suite.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    testLogging {
        showStandardStreams = true
    }
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.3")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Dependency bytecode includes legacy JOML class versions and optional Skript annotations.
    // Source diagnostics stay strict; third-party class-file diagnostics are not actionable here.
    options.compilerArgs.addAll(['-Xlint:all,-classfile', '-Werror'])

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

apply from: 'gradle/java-quality.gradle'

apply from: 'gradle/mikd-protocol.gradle'

processResources {
    from('shared/chat/link-rules.json') { into 'chat' }
    includeEmptyDirs = false
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

tasks.named('test') {
    inputs.file('shared/chat/link-cases.json')
}

// Explicit integration check against the paired web client, separate from the default JVM build.
tasks.register('chatInterop', JavaExec) {
    group = 'verification'
    description = 'Exercise the real web client against mikd WebSocket through an HTTPS proxy, history and Paper delivery.'
    dependsOn testClasses, tasks.named('buildMikd')
    inputs.file(layout.projectDirectory.file('target/debug/mikd'))
    systemProperty 'mikd.binary', layout.projectDirectory.file('target/debug/mikd').asFile.absolutePath
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.encinet.mik.integration.mikd.WebChatInteropHarness'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args file('tests/interop/chat-client.mjs').absolutePath,
            file(providers.gradleProperty('webChatProject').getOrElse('../mikweb')).absolutePath
}
