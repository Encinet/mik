# Install as /etc/mikd/ai.yml to enable the assistant.
provider:
  endpoint: https://model.example.org/v1/chat/completions
  model: your-model
  # Enable only for Chat Completions endpoints that stream reasoning.summary details.
  reasoning-summaries: false
  request-options:
    reasoning_effort: low

web-search:
  enabled: false

# Set MIKD_MODEL_API_KEY in secrets.env if required by the provider.
